<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  <title>Java 1</title>
  </head>
<body>
<h1>
  Java 1
</h1>
  <p>Test</p>


  <label>Numri i pare :</label>
  <input type="number" id ="nr1">
</br>
    <label>Numri i dyte :</label>
  <input type="number" id ="nr2">
  </br>
<button type = "submit" onclick="sub()">=====</button>
  </br>
  <button type = "submit" onclick="ext()">=====</button>
    </br>
    <button type = "submit" onclick="times()">=====</button>
  </br>
      <button type = "submit" onclick="divide()">=====</button>
  </br>

  <p id="result"></p>
    <p id="result2"></p>
      <p id="result3"></p>
      <p id="result4"></p>

  </br>
  </hr>

  <h1>Ritja / Zbritja te numrit </h1>
  <p id="numri">0</p>
  <button type="submit" onclick="rritje()">+++</button>
  <button type="submit" onclick="zbritje()">---</button>

  <script>

  function sub(){
    var a=Number(document.getElementById("nr1").value);
    var b=Number(document.getElementById("nr2").value);
    var c = a+b ;
    document.getElementById("result").innerHTML=c;

  }

     function ext(){
    var a=Number(document.getElementById("nr1").value);
    var b=Number(document.getElementById("nr2").value);
    var c = a-b ;
    document.getElementById("result2").innerHTML=c;

  }

     function times(){
    var a=Number(document.getElementById("nr1").value);
    var b=Number(document.getElementById("nr2").value);
    var c = a*b ;
    document.getElementById("result3").innerHTML=c;

  }
     function divide(){
    var a=Number(document.getElementById("nr1").value);
    var b=Number(document.getElementById("nr2").value);
       if(b==0) {
             document.getElementById("result4").innerHTML=("Nuk pjestohet me 0");

       } else{ 
    var c = a/b ;
             document.getElementById("result4").innerHTML=c;

       }
  }


    var n=0;
    function rritje(){
      n=n+1;
    document.getElementById("numri").innerHTML=n;

  }

    function zbritje(){
      n=n-1;
    document.getElementById("numri").innerHTML=n;

  }
  </script>
</body>
  
</html>
